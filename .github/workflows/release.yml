# Publishes automatically on every push to main that changes the provider:
#   1. next-version (jobcelis-team/.github) picks the version: the last release
#      plus a patch, or the version in VERSION when it was raised by hand.
#      Docs, tests, CI and repo config release nothing.
#   2. writes it into VERSION, commits it, pushes it and tags vX.Y.Z
#   3. GoReleaser builds, signs (GPG_PRIVATE_KEY) and creates the GitHub Release,
#      which the Terraform Registry picks up as jobcelis-team/jobcelis
# To release a minor or major version, raise it in VERSION. Pushing a vX.Y.Z tag
# by hand still releases that tag.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: current
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Next version
        id: v
        if: github.ref_type != 'tag'
        uses: jobcelis-team/.github/actions/next-version@main
        with:
          current: ${{ steps.current.outputs.version }}
          tag-prefix: "v"

      - name: Write the version
        if: steps.v.outputs.release == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: echo "$VERSION" > VERSION

      - name: Commit the version
        if: steps.v.outputs.release == 'true'
        uses: jobcelis-team/.github/actions/commit-version@main
        with:
          version: ${{ steps.v.outputs.version }}

      # GoReleaser releases the tag on HEAD, so tag before building. A tag pushed
      # with GITHUB_TOKEN does not start other workflows, so GoReleaser runs here.
      - name: Push the version and tag the release
        if: steps.v.outputs.release == 'true'
        uses: jobcelis-team/.github/actions/push-release@main
        with:
          tag: ${{ steps.v.outputs.tag }}
          # GoReleaser creates the GitHub Release (signed checksums)
          release: "false"

      - name: Release?
        id: go
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${{ steps.v.outputs.release }}" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v7
        if: steps.go.outputs.release == 'true'
        with:
          go-version-file: go.mod

      - name: Import GPG key
        id: import_gpg
        if: steps.go.outputs.release == 'true'
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Run GoReleaser
        if: steps.go.outputs.release == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
